# Proves the signed self-updater end to end on a clean GitHub macOS runner. Never run on a desk Mac.
#
# Builds PlantGPT N (0.0.1) and N+1 (0.0.2) with the publik-build.yml command, compiled to read their
# update feed from http://127.0.0.1:$FEED_PORT/latest.json (PUBLIK_UPDATE_ENDPOINT at build time;
# plain HTTP on loopback needs dangerousInsecureTransportProtocol, set for these test builds only).
# Then, on macos-latest: install N, serve the feed in the job, and run N's updater self-test
# (PUBLIK_UPDATE_SELF_TEST, src-tauri/src/updates.rs) against
#   - a feed whose signature is from another key                  -> refused, N stays on disk
#   - a feed whose package has one byte changed                    -> refused, N stays on disk
#   - a feed that announces a version the signature does not name  -> refused, N stays on disk
#   - the good feed                                                -> N+1 installed, the app on disk reports N+1
# It also checks that the updated app keeps the bundle id, the signing certificate and the
# designated requirement (what TCC permissions are bound to). The runner has no Developer ID, so
# both builds are signed with one throwaway certificate (see tests/updater/proof-macos.sh).
# PlantGPT ships for macOS only, so there is no Windows job.
# Nothing is published: no release, no tag. Results: the job summary and the updater-proof-macos artifact.
name: updater-proof

on:
  workflow_dispatch:
  # A workflow_dispatch workflow can be started only once it is on the default branch; the push
  # trigger lets it run from a branch before that.
  push:
    branches: ['feat/updater', 'updater/**']
    paths: ['src-tauri/**', 'src/**', 'package.json', 'package-lock.json', 'scripts/updater-*', 'scripts/build-macos.sh', 'tests/updater/**', '.github/workflows/updater-proof.yml']

permissions:
  contents: read

concurrency:
  group: updater-proof-${{ github.ref }}
  cancel-in-progress: true

env:
  DO_NOT_TRACK: '1'
  PUBLIK_NO_AUTO_UPDATE: '1'
  FEED_PORT: '47390'
  N: '0.0.1'
  N1: '0.0.2'

jobs:
  build-macos:
    name: Build macOS ${{ matrix.version }}
    strategy:
      matrix:
        version: ['0.0.1', '0.0.2']
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The toolchain of publik-build.yml.
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustc --version && cargo --version && uname -m

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: updater-proof
          cache-on-failure: true

      - name: Install
        run: npm ci

      # The publik-build.yml command (ad hoc, no updater artifacts: the release packs the update
      # bundle after Developer ID signing), plus the test version and the loopback feed.
      # No app token: the updater self-test does not run the sign-in gate.
      - name: Build PlantGPT.app ${{ matrix.version }}
        env:
          PUBLIK_UPDATE_ENDPOINT: http://127.0.0.1:${{ env.FEED_PORT }}/latest.json
          VERSION: ${{ matrix.version }}
        run: |
          printf '{"version":"%s","bundle":{"createUpdaterArtifacts":false,"macOS":{"signingIdentity":"-"}},"plugins":{"updater":{"dangerousInsecureTransportProtocol":true}}}' "$VERSION" > "$RUNNER_TEMP/proof.conf.json"
          npx tauri build --bundles app --config "$RUNNER_TEMP/proof.conf.json" -- --locked
          APP=src-tauri/target/release/bundle/macos/PlantGPT.app
          EXE="$APP/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$VERSION"
          test "$(lipo -archs "$EXE")" = arm64
          grep -q -a -F "127.0.0.1:$FEED_PORT/latest.json" "$EXE"
          test ! -e "$APP.tar.gz"
          mkdir -p dist
          ditto -c -k --keepParent "$APP" "dist/PlantGPT-$VERSION.app.zip"

      # The unit test of the shipped updater config (src-tauri/src/updates.rs), once.
      - name: cargo test
        if: matrix.version == '0.0.1'
        working-directory: src-tauri
        run: cargo test --locked

      - uses: actions/upload-artifact@v4
        with:
          name: build-macos-${{ matrix.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  proof-macos:
    name: Proof on macos-latest
    needs: build-macos
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # For the Tauri CLI (tauri signer): the release pack script signs with it.
      - name: Install
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          pattern: build-macos-*
          path: builds
          merge-multiple: true

      - name: Unpack N and N+1
        run: |
          uname -m; sw_vers
          mkdir -p apps/N apps/N1
          ditto -x -k "builds/PlantGPT-$N.app.zip" apps/N
          ditto -x -k "builds/PlantGPT-$N1.app.zip" apps/N1

      - name: Prove the updater
        timeout-minutes: 20
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash tests/updater/proof-macos.sh apps/N/PlantGPT.app apps/N1/PlantGPT.app out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: updater-proof-macos
          path: out/
          retention-days: 30
