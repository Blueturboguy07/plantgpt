[package]
name = "plantgpt"
version = "0.1.4"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
# Signed self-update (src/updates.rs, docs/updates.md). 2.14 or later: requireSignedVersion,
# the atomic bundle swap on macOS and the verify-before-install step.
tauri-plugin-updater = "2.14"
# The update timer (src/updates.rs). Already in the build through reqwest; no new crate.
tokio = { version = "1", features = ["time"] }
# The publik module (src/publik.rs): JSON and a UUID v4 per install. HTTP goes through the system curl.
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# The update timer tests (src/updates.rs) run on a paused tokio clock. test-util adds no crate
# (it turns on tokio's own rt, sync and time), so Cargo.lock does not change, and a release build
# does not use it.
tokio = { version = "1", features = ["test-util"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
